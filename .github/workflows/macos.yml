name: macOS installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-install:
    runs-on: macos-15          # Apple Silicon
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Build the app and the disk image
        run: bash installer/build_dmg.sh

      - name: Install from the disk image, as a user would
        run: |
          mkdir -p ~/Applications
          mount="$(hdiutil attach -nobrowse -readonly dist/StandIn-*.dmg | awk -F'\t' '/\/Volumes\// {print $NF}')"
          echo "mounted at $mount"; ls -la "$mount"
          cp -R "$mount/StandIn.app" ~/Applications/
          hdiutil detach "$mount"
          # what Gatekeeper makes of it once downloaded (a browser adds the quarantine flag)
          xattr -w com.apple.quarantine "0083;$(printf %x $(date +%s));Safari;" ~/Applications/StandIn.app
          spctl --assess --type execute -vv ~/Applications/StandIn.app 2>&1 || true
          codesign -dv ~/Applications/StandIn.app 2>&1 || true
          xattr -dr com.apple.quarantine ~/Applications/StandIn.app   # (what "Open Anyway" amounts to)

      - name: First launch (sets up Python and the packages)
        run: |
          start=$(date +%s)
          ~/Applications/StandIn.app/Contents/MacOS/StandIn --selftest out/first
          echo "first launch: $(( $(date +%s) - start )) s"
          tail -5 ~/Library/Application\ Support/StandIn/setup.log
          du -sh ~/Library/Application\ Support/StandIn/* || true

      - name: Second launch, through Launch Services (as a double-click)
        run: |
          start=$(date +%s)
          open -W -n ~/Applications/StandIn.app --args --selftest "$PWD/out/second"
          echo "second launch: $(( $(date +%s) - start )) s"
          cat out/second/report.json

      - name: A screenshot of the screen with the window
        continue-on-error: true
        run: |
          ~/Applications/StandIn.app/Contents/MacOS/StandIn &
          pid=$!
          sleep 8
          screencapture -x out/screen.png || echo "screencapture failed"
          kill $pid || true

      - name: numba's threading layer -- which way gives it OpenMP
        run: ~/Library/Application\ Support/StandIn/env/bin/python -m standin_app.openmp | tee out/numba_layers.txt

      - name: Two threads launching numba parallel kernels at once (ends the process on workqueue)
        run: |
          ~/Library/Application\ Support/StandIn/env/bin/python - <<'EOF'
          import threading, numpy as np, numba

          @numba.njit(parallel=True)
          def busy(a):
              s = 0.0
              for i in numba.prange(a.shape[0]):
                  s += np.sqrt(a[i])
              return s

          a = np.random.rand(1_000_000)
          busy(a)
          print("layer:", numba.threading_layer())
          t = threading.Thread(target=lambda: [busy(a) for _ in range(300)])
          t.start()
          while t.is_alive():
              busy(a)
          t.join()
          print("survived")
          EOF

      - name: An update from within the app (0.1.0 -> 0.2.0), installed once the app has quit
        run: |
          DATA=~/Library/Application\ Support/StandIn
          sed -i '' 's/^version = "0.1.0"/version = "0.2.0"/' standin_app/pyproject.toml
          "$DATA/bin/uv" build --wheel --out-dir out/v2 standin_app
          git checkout standin_app/pyproject.toml
          ~/Applications/StandIn.app/Contents/MacOS/StandIn &        # the app, open
          app=$!
          sleep 10
          # its Updates button: the same Python, with the variables its launcher set
          MACAPP_DATA="$DATA" MACAPP_UV="$DATA/bin/uv" MACAPP_BUNDLE_ID=io.github.ryhattori.standin \
            "$DATA/env/bin/python" -m standin_app.update out/v2/*.whl installer/requirements.txt --wait-pid $app
          kill $app                                                     # the app quits
          for i in $(seq 1 300); do grep -qE "=== .* updated|FAILED" "$DATA/update.log" && break; sleep 2; done
          cat "$DATA/update.log" | grep -vE "^ [+-] |^(Resolved|Prepared|Installed|Uninstalled|Audited|Checked)"
          "$DATA/env/bin/python" -c "from importlib import metadata; v = metadata.version('standin-app'); print('installed', v); assert v == '0.2.0'"
          cat "$DATA/env/.bundle_id"
          # opened again by the update (open -b): its process appears
          for i in $(seq 1 30); do pgrep -f "$DATA/env/bin/python" && break; sleep 2; done
          sleep 8
          screencapture -x out/after_update.png || true
          pkill -f "$DATA/env/bin/python" || true
          ls "$DATA"

      - name: A failing update leaves the app as it was
        run: |
          DATA=~/Library/Application\ Support/StandIn
          sleep 3
          printf 'no-such-package-for-this-test==1.0\n' > out/bad-requirements.txt
          # (no app open: a process number that is not running; no bundle id: the app is not opened again)
          MACAPP_DATA="$DATA" MACAPP_UV="$DATA/bin/uv" MACAPP_BUNDLE_ID="" \
            "$DATA/env/bin/python" -m standin_app.update out/v2/*.whl out/bad-requirements.txt --wait-pid 99999
          for i in $(seq 1 120); do [ "$(grep -c FAILED "$DATA/update.log")" -ge 1 ] && break; sleep 2; done
          tail -5 "$DATA/update.log"
          grep -q "FAILED: the packages could not be installed" "$DATA/update.log"
          test ! -e "$DATA/env.update"
          "$DATA/env/bin/python" -c "from importlib import metadata; v = metadata.version('standin-app'); print('still', v); assert v == '0.2.0'"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-installer-results
          path: |
            out/
            dist/*.dmg
            ~/Library/Application Support/StandIn/setup.log
